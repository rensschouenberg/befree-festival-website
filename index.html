/* ============================================================
   BeFree Festival — Foundations
   Colors, type, spacing, radii, shadows
   ============================================================ */

/* ---------- Type: Roc Grotesk (commercial) ----------
   The brand specifies Roc Grotesk. It is a commercial Displaay
   typeface and cannot be redistributed here, so the system loads
   Hanken Grotesk + Archivo Black from Google Fonts as the closest
   open-source visual match. Swap to real Roc Grotesk files when
   licensed (drop .woff2 into /fonts and update the @font-face rule
   below).
----------------------------------------------------------------- */
/* fonts loaded via <link> in head */

/* When real Roc Grotesk files are available, uncomment + populate:
@font-face {
  font-family: 'Roc Grotesk';
  src: url('fonts/RocGrotesk-Regular.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Roc Grotesk';
  src: url('fonts/RocGrotesk-Heavy.woff2') format('woff2');
  font-weight: 900; font-style: normal; font-display: swap;
}
*/

:root {
  /* ---------- Brand color ---------- */
  --bf-orange:        #f14702;   /* logo orange — primary brand */
  --bf-orange-bg:     #e1582c;   /* background orange — surface */
  --bf-orange-deep:   #c43904;   /* darker orange for press / hovered states */
  --bf-orange-tint:   #ffe5d6;   /* warm cream tint for chips, hover */

  /* ---------- Neutrals ---------- */
  --bf-ink:           #0a0a0a;   /* near-black — wordmark, body text */
  --bf-ink-soft:      #1a1a1a;   /* slightly softer black */
  --bf-bone:          #f7efe2;   /* warm off-white — paper/cream surface */
  --bf-paper:         #fffaf2;   /* lighter cream for cards on orange */
  --bf-mute:          #8a8580;   /* muted text on bone */
  --bf-line:          #0a0a0a;   /* default border = pure black, hand-drawn vibe */

  /* ---------- Semantic surfaces ---------- */
  --bf-surface:           var(--bf-bone);
  --bf-surface-orange:    var(--bf-orange-bg);
  --bf-surface-ink:       var(--bf-ink);
  --bf-surface-paper:     var(--bf-paper);

  /* ---------- Semantic text ---------- */
  --bf-fg:            var(--bf-ink);
  --bf-fg-on-orange:  var(--bf-ink);     /* black ON orange is signature */
  --bf-fg-on-ink:     var(--bf-bone);
  --bf-fg-mute:       var(--bf-mute);
  --bf-fg-accent:     var(--bf-orange);

  /* ---------- Type stacks ---------- */
  --bf-font-display:  'Archivo Black', 'Roc Grotesk', 'Inter', system-ui, sans-serif;
  --bf-font-body:     'Hanken Grotesk', 'Roc Grotesk', 'Inter', system-ui, sans-serif;
  --bf-font-mono:     ui-monospace, 'JetBrains Mono', 'Menlo', monospace;

  /* ---------- Type scale (display first) ---------- */
  --bf-text-hero:     clamp(72px, 14vw, 220px);  /* festival-poster scale */
  --bf-text-h1:       clamp(48px, 7vw, 96px);
  --bf-text-h2:       clamp(36px, 5vw, 64px);
  --bf-text-h3:       28px;
  --bf-text-h4:       22px;
  --bf-text-lead:     20px;
  --bf-text-body:     16px;
  --bf-text-small:    14px;
  --bf-text-xs:       12px;
  --bf-text-eyebrow:  13px; /* uppercase, tracked */

  --bf-leading-tight:   0.92;
  --bf-leading-display: 0.95;
  --bf-leading-body:    1.45;

  /* ---------- Spacing scale (4 → 96) ---------- */
  --bf-s-1:  4px;
  --bf-s-2:  8px;
  --bf-s-3:  12px;
  --bf-s-4:  16px;
  --bf-s-5:  24px;
  --bf-s-6:  32px;
  --bf-s-7:  48px;
  --bf-s-8:  64px;
  --bf-s-9:  96px;

  /* ---------- Radii ----------
     BeFree is a hand-drawn, sticker-style brand. Defaults are CHUNKY,
     never delicate. */
  --bf-r-sm:   6px;
  --bf-r-md:   12px;
  --bf-r-lg:   20px;
  --bf-r-xl:   32px;
  --bf-r-pill: 999px;

  /* ---------- Borders ---------- */
  --bf-bw-1:   2px;
  --bf-bw-2:   3px;
  --bf-bw-3:   4px;   /* default chunky border */

  /* ---------- Shadows / offsets ----------
     The system uses HARD offsets (not soft shadows) — flat black
     drop shadows that read like printed stickers. */
  --bf-shadow-sticker:   4px 4px 0 0 var(--bf-ink);
  --bf-shadow-sticker-lg: 8px 8px 0 0 var(--bf-ink);
  --bf-shadow-soft:      0 12px 32px -8px rgba(10,10,10,0.18);

  /* ---------- Motion ---------- */
  --bf-ease:        cubic-bezier(0.2, 0.8, 0.2, 1);
  --bf-ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --bf-dur-fast:    140ms;
  --bf-dur-base:    220ms;
  --bf-dur-slow:    420ms;
}

/* ============================================================
   Semantic element styles
   ============================================================ */

body {
  font-family: var(--bf-font-body);
  color: var(--bf-fg);
  background: var(--bf-surface);
  font-size: var(--bf-text-body);
  line-height: var(--bf-leading-body);
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--bf-font-display);
  font-weight: 900;
  color: var(--bf-fg);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  line-height: var(--bf-leading-display);
  margin: 0;
}

h1 { font-size: var(--bf-text-h1); line-height: var(--bf-leading-tight); letter-spacing: -0.02em; }
h2 { font-size: var(--bf-text-h2); line-height: var(--bf-leading-tight); letter-spacing: -0.02em; }
h3 { font-size: var(--bf-text-h3); }
h4 { font-size: var(--bf-text-h4); }

.bf-hero {
  font-family: var(--bf-font-display);
  font-size: var(--bf-text-hero);
  line-height: var(--bf-leading-tight);
  letter-spacing: -0.03em;
  text-transform: uppercase;
}

.bf-eyebrow {
  font-family: var(--bf-font-body);
  font-size: var(--bf-text-eyebrow);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
}

.bf-lead {
  font-size: var(--bf-text-lead);
  line-height: 1.4;
  font-weight: 500;
}

p { margin: 0 0 var(--bf-s-4) 0; }
small, .bf-small { font-size: var(--bf-text-small); }

code, kbd, pre {
  font-family: var(--bf-font-mono);
  font-size: 0.92em;
}

a {
  color: var(--bf-ink);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  text-decoration-color: var(--bf-orange);
  transition: color var(--bf-dur-fast) var(--bf-ease);
}
a:hover { color: var(--bf-orange); }


/* ===== */

/* BeFree Festival website UI kit — component styles
   Tokens are in ../../colors_and_type.css */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bf-bone); overflow-x: hidden; }

button { font: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
a { cursor: pointer; }

/* ---------- Marquee ---------- */
.bf-strip {
  background: var(--bf-orange);
  border-top: 3px solid var(--bf-ink);
  border-bottom: 3px solid var(--bf-ink);
  padding: 16px 0;
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  z-index: 1;
}
.bf-strip--dark { background: var(--bf-ink); color: var(--bf-orange); }
.bf-strip__track {
  display: inline-block;
  animation: bf-marq 28s linear infinite;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 32px;
  letter-spacing: -0.01em;
  padding-left: 0;
}
.bf-strip__track > span { padding-right: 32px; }
@keyframes bf-marq { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

/* ---------- Nav ---------- */
.bf-nav-wrap {
  position: sticky;
  top: 18px;
  z-index: 50;
  padding: 0 24px;
  margin-top: 18px;
}
.bf-nav {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bf-paper);
  border: 3px solid var(--bf-ink);
  border-radius: 999px;
  padding: 8px 8px 8px 22px;
  box-shadow: var(--bf-shadow-sticker);
  gap: 24px;
}
.bf-nav__brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 22px;
  letter-spacing: -0.01em;
  text-decoration: none;
  color: var(--bf-ink);
}
.bf-nav__brand img { width: 36px; height: 36px; object-fit: contain; }
.bf-nav__links {
  display: flex; gap: 24px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 14px;
  letter-spacing: 0.04em;
}
.bf-nav__links a { color: var(--bf-ink); text-decoration: none; }
.bf-nav__links a.is-active { color: var(--bf-orange); }
.bf-nav__links a:hover { color: var(--bf-orange); }

/* ---------- Buttons ---------- */
.bf-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  border: 3px solid var(--bf-ink);
  border-radius: 999px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 14px;
  letter-spacing: 0.03em;
  color: var(--bf-ink);
  background: var(--bf-paper);
  box-shadow: var(--bf-shadow-sticker);
  text-decoration: none;
  transition: transform var(--bf-dur-fast) var(--bf-ease), box-shadow var(--bf-dur-fast) var(--bf-ease), background var(--bf-dur-fast) var(--bf-ease);
  white-space: nowrap;
}
.bf-btn--primary { background: var(--bf-orange); }
.bf-btn--dark { background: var(--bf-ink); color: var(--bf-bone); }
.bf-btn--ghost { background: transparent; box-shadow: none; }
.bf-btn--lg { padding: 16px 28px; font-size: 16px; }
.bf-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 0 var(--bf-ink); }
.bf-btn--ghost:hover { background: var(--bf-orange-tint); box-shadow: var(--bf-shadow-sticker); transform: none; }
.bf-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 0 var(--bf-ink); }
.bf-btn:focus-visible { outline: 3px solid var(--bf-orange); outline-offset: 3px; }
.bf-arrow { display: inline-block; transition: transform var(--bf-dur-fast) var(--bf-ease); }
.bf-btn:hover .bf-arrow { transform: translateX(3px); }

/* ---------- Hero ---------- */
.bf-hero {
  position: relative;
  background: var(--bf-orange-bg);
  border-bottom: 4px solid var(--bf-ink);
  overflow: hidden;
  min-height: 720px;
  padding: 80px 24px 64px;
  display: flex; align-items: center; justify-content: center;
}
.bf-hero__inner {
  position: relative;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  z-index: 2;
  text-align: center;
}
.bf-hero__eyebrow { color: var(--bf-ink); margin-bottom: 18px; }
.bf-hero__title {
  font-family: var(--bf-font-display);
  font-size: clamp(96px, 18vw, 280px);
  line-height: 0.85;
  text-transform: uppercase;
  letter-spacing: -0.04em;
  color: var(--bf-ink);
  margin: 0 0 24px 0;
}
.bf-hero__meta {
  display: inline-flex; gap: 10px; align-items: center;
  background: var(--bf-ink);
  color: var(--bf-bone);
  padding: 10px 22px;
  border-radius: 999px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 14px;
  letter-spacing: 0.04em;
  border: 3px solid var(--bf-ink);
  box-shadow: var(--bf-shadow-sticker);
  margin-bottom: 28px;
  transform: rotate(-1.5deg);
  flex-wrap: wrap;
  justify-content: center;
}
.bf-hero__meta .bf-dot { color: var(--bf-orange); }
.bf-hero__actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.bf-hero__sticker {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  filter: drop-shadow(2px 2px 0 var(--bf-ink));
}

/* ---------- Sections ---------- */
.bf-section {
  padding: 96px 24px;
  position: relative;
}
.bf-section--dark { background: var(--bf-ink); color: var(--bf-bone); }
.bf-section--dark h2, .bf-section--dark h3 { color: var(--bf-bone); }
.bf-section--cream { background: var(--bf-bone); }
.bf-section__head { max-width: 1280px; margin: 0 auto 48px; text-align: center; }
.bf-section__head h2 { margin: 12px 0 12px 0; }
.bf-section__head .bf-lead { color: var(--bf-mute); max-width: 560px; margin: 0 auto; }
.bf-section--dark .bf-section__head .bf-lead { color: rgba(247, 239, 226, 0.7); }

/* ---------- Pills / filters ---------- */
.bf-filters { display: flex; gap: 10px; justify-content: center; margin-bottom: 36px; flex-wrap: wrap; max-width: 1280px; margin-left: auto; margin-right: auto; }
.bf-pill {
  padding: 10px 18px;
  border: 3px solid var(--bf-ink);
  border-radius: 999px;
  background: var(--bf-paper);
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--bf-ink);
  transition: all var(--bf-dur-fast) var(--bf-ease);
}
.bf-pill:hover { background: var(--bf-orange-tint); }
.bf-pill.is-active { background: var(--bf-orange); box-shadow: var(--bf-shadow-sticker); }

/* ---------- Line-up ---------- */
.bf-lineup {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 22px;
}
.bf-act {
  background: var(--bf-paper);
  border: 3px solid var(--bf-ink);
  border-radius: 18px;
  padding: 18px 18px 16px;
  box-shadow: var(--bf-shadow-sticker);
  transition: transform var(--bf-dur-base) var(--bf-ease), box-shadow var(--bf-dur-base) var(--bf-ease);
  cursor: pointer;
}
.bf-act:hover { transform: translate(-2px, -2px) rotate(0) !important; box-shadow: 8px 8px 0 0 var(--bf-ink); }
.bf-act--head { background: var(--bf-ink); color: var(--bf-bone); }
.bf-act--big { background: var(--bf-orange); }
.bf-act--after { background: var(--bf-bone); border-style: dashed; }
.bf-act__time { font-family: var(--bf-font-mono); font-size: 12px; opacity: 0.7; letter-spacing: 0.04em; }
.bf-act--head .bf-act__time { color: var(--bf-orange); opacity: 1; }
.bf-act__name { font-family: var(--bf-font-display); text-transform: uppercase; font-size: 30px; line-height: 0.95; letter-spacing: -0.02em; margin: 6px 0 10px; }
.bf-act__stage { font-family: var(--bf-font-body); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.7; }
.bf-act--head .bf-act__stage { color: var(--bf-orange); opacity: 1; }

/* ---------- Info strip ---------- */
.bf-info {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.bf-info__card {
  background: var(--bf-paper);
  color: var(--bf-ink);
  border: 3px solid var(--bf-orange);
  border-radius: 22px;
  padding: 28px;
  box-shadow: 6px 6px 0 0 var(--bf-orange);
}
.bf-info__card:nth-child(2) { background: var(--bf-orange); border-color: var(--bf-bone); box-shadow: 6px 6px 0 0 var(--bf-bone); }
.bf-info__eye { color: var(--bf-orange); }
.bf-info__card:nth-child(2) .bf-info__eye { color: var(--bf-ink); }
.bf-info__title { font-family: var(--bf-font-display); text-transform: uppercase; font-size: 48px; line-height: 0.95; letter-spacing: -0.02em; margin: 12px 0; }
.bf-info__body { font-size: 15px; line-height: 1.5; margin: 0; font-weight: 500; }

/* ---------- Tickets ---------- */
.bf-tickets {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.bf-ticket {
  background: var(--bf-paper);
  border: 3px solid var(--bf-ink);
  border-radius: 22px;
  padding: 28px 24px;
  box-shadow: var(--bf-shadow-sticker);
  text-align: left;
  font-family: var(--bf-font-body);
  transition: transform var(--bf-dur-base) var(--bf-ease), box-shadow var(--bf-dur-base) var(--bf-ease);
}
.bf-ticket:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 0 var(--bf-ink); }
.bf-ticket--featured { background: var(--bf-orange); }
.bf-ticket.is-picked { box-shadow: 0 0 0 4px var(--bf-orange-deep), var(--bf-shadow-sticker); }
.bf-ticket__name { font-family: var(--bf-font-display); text-transform: uppercase; font-size: 20px; letter-spacing: -0.01em; }
.bf-ticket__price { font-family: var(--bf-font-display); font-size: 60px; line-height: 1; margin: 12px 0; letter-spacing: -0.03em; }
.bf-ticket__sub { font-size: 15px; font-weight: 600; }
.bf-ticket__note { font-size: 12px; color: var(--bf-mute); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.bf-ticket--featured .bf-ticket__note { color: var(--bf-ink); opacity: 0.7; }
.bf-ticket__cta { margin-top: 18px; font-family: var(--bf-font-display); text-transform: uppercase; font-size: 13px; letter-spacing: 0.04em; padding-top: 14px; border-top: 2px dashed var(--bf-ink); }

/* ---------- Newsletter ---------- */
.bf-news {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
}
.bf-news__title { font-size: clamp(48px, 8vw, 96px); line-height: 0.9; }
.bf-news__form { display: flex; flex-direction: column; gap: 14px; }
.bf-news__done {
  background: var(--bf-orange);
  border: 3px solid var(--bf-ink);
  border-radius: 18px;
  padding: 22px;
  box-shadow: var(--bf-shadow-sticker);
}

/* ---------- Fields ---------- */
.bf-field {
  width: 100%;
  border: 3px solid var(--bf-ink);
  background: var(--bf-paper);
  padding: 14px 18px;
  border-radius: 14px;
  font-family: var(--bf-font-body);
  font-size: 16px;
  font-weight: 500;
  color: var(--bf-ink);
  outline: none;
  box-sizing: border-box;
}
.bf-field:focus { box-shadow: 0 0 0 3px var(--bf-orange); }
.bf-field::placeholder { color: #a39e95; }

/* ---------- Footer ---------- */
.bf-footer { background: var(--bf-ink); color: var(--bf-bone); padding: 64px 24px 24px; border-top: 4px solid var(--bf-ink); }
.bf-footer__top { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 48px; }
.bf-footer__brand { display: flex; align-items: center; gap: 14px; }
.bf-footer__brand img { width: 64px; height: 64px; background: var(--bf-orange); padding: 6px; border-radius: 14px; border: 3px solid var(--bf-bone); }
.bf-footer__name { font-family: var(--bf-font-display); text-transform: uppercase; font-size: 22px; letter-spacing: -0.01em; }
.bf-footer__sub { color: rgba(247,239,226,0.6); font-size: 13px; margin-top: 4px; }
.bf-footer__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.bf-footer__col { display: flex; flex-direction: column; gap: 8px; }
.bf-footer__col .bf-eyebrow { color: var(--bf-orange); margin-bottom: 6px; }
.bf-footer__col a { color: var(--bf-bone); text-decoration: none; font-size: 15px; }
.bf-footer__col a:hover { color: var(--bf-orange); }
.bf-footer__bottom { max-width: 1280px; margin: 48px auto 0; padding-top: 22px; border-top: 1px solid rgba(247,239,226,0.15); display: flex; justify-content: space-between; font-size: 13px; color: rgba(247,239,226,0.5); }

/* ---------- Modal ---------- */
.bf-modal {
  position: fixed; inset: 0;
  background: rgba(10, 10, 10, 0.55);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 24px;
}
.bf-modal__card {
  background: var(--bf-paper);
  border: 3px solid var(--bf-ink);
  border-radius: 22px;
  padding: 28px;
  width: 100%; max-width: 460px;
  box-shadow: var(--bf-shadow-sticker-lg);
  position: relative;
}
.bf-modal__close {
  position: absolute; top: 14px; right: 14px;
  width: 36px; height: 36px;
  border-radius: 999px;
  border: 3px solid var(--bf-ink);
  background: var(--bf-paper);
  font-family: var(--bf-font-display);
  font-size: 14px;
}
.bf-modal__row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.bf-modal__label { font-family: var(--bf-font-display); text-transform: uppercase; font-size: 11px; letter-spacing: 0.08em; }
.bf-modal__val { font-weight: 700; font-size: 16px; }
.bf-mute { color: var(--bf-mute); }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .bf-nav__links { display: none; }
  .bf-info, .bf-tickets { grid-template-columns: 1fr; }
  .bf-news { grid-template-columns: 1fr; }
  .bf-footer__top { grid-template-columns: 1fr; }
  .bf-footer__cols { grid-template-columns: repeat(2, 1fr); }
}


/* ===== */

/* BeFree Festival website — extras on top of kit.css */

html { scroll-behavior: smooth; }
body { color: var(--bf-ink); }

/* ---------- Layout helper ---------- */
.bf-container { max-width: 1280px; margin: 0 auto; }
.bf-eyebrow { display: inline-block; }

/* ---------- Heart sticker (recreated from logo for inline use) ---------- */
.bf-sticker {
  display: inline-block;
  width: 1em;
  height: 1em;
  vertical-align: -0.12em;
}

/* ---------- Hero overrides ---------- */
.bf-hero {
  min-height: 88vh;
  padding: 120px 24px 96px;
  background:
    radial-gradient(ellipse at 80% 110%, rgba(10,10,10,0.18), transparent 55%),
    radial-gradient(ellipse at 12% -10%, rgba(255,229,214,0.35), transparent 55%),
    var(--bf-orange-bg);
}
.bf-hero__inner { text-align: left; }
.bf-hero__title {
  font-size: clamp(120px, 22vw, 360px);

  margin: 16px 0 28px;
}
.bf-hero__title .year {
  display: inline-block;
  color: var(--bf-bone);
  -webkit-text-stroke: 4px var(--bf-ink);

  padding-left: 0.1em;
}
.bf-hero__meta {
  transform: rotate(-1.5deg);
  font-size: 16px;
  padding: 12px 24px;
}
.bf-hero__top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 24px;
  gap: 24px;
  flex-wrap: wrap;
}
.bf-hero__chip {
  background: var(--bf-ink);
  color: var(--bf-bone);
  border: 3px solid var(--bf-ink);
  border-radius: 999px;
  padding: 10px 18px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 13px;
  letter-spacing: 0.06em;

.bf-hero__chip .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--bf-orange); animation: bf-pulse 2s infinite ease-in-out; }
@keyframes bf-pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

.bf-hero__sticker--big {
  position: absolute;
  width: clamp(260px, 30vw, 440px);
  right: -40px;
  top: 60px;
  transform: rotate(14deg);
  z-index: 1;

}
.bf-hero__sticker--sm {
  position: absolute;

}

.bf-hero__count {

  grid-template-columns: repeat(4, auto);

}
.bf-count {

/* ---------- Sections shared ---------- */
.bf-section { padding: 96px 24px; }
.bf-section--orange { background: var(--bf-orange-bg); border-block: 4px solid var(--bf-ink); }
.bf-section__eye { font-family: var(--bf-font-body); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--bf-orange); }
.bf-section--dark .bf-section__eye { color: var(--bf-orange); }
.bf-section--orange .bf-section__eye { color: var(--bf-ink); }

/* ---------- About ---------- */
.bf-about {

.bf-gig__stage {

  border: 2px solid var(--bf-ink);
  border-radius: 999px;
  padding: 6px 14px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.08em;
  background: var(--bf-paper);
}
.bf-gig__stage--main { background: var(--bf-orange); }
.bf-gig__stage--after { background: var(--bf-ink); color: var(--bf-bone); }
.bf-gig__edit {
  width: 32px; height: 32px;
  border-radius: 999px;
  border: 2px solid var(--bf-ink);
  background: var(--bf-paper);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all var(--bf-dur-fast) var(--bf-ease);
}
.bf-gig__edit:hover { background: var(--bf-orange); transform: rotate(-8deg); }

.bf-schedule__foot {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bf-bone);
  padding: 16px 24px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 13px;
  letter-spacing: 0.06em;
  border-top: 4px solid var(--bf-ink);
}
.bf-schedule__add {
  border: 2px dashed var(--bf-ink);
  background: transparent;
  padding: 10px 18px;
  border-radius: 999px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.06em;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.bf-schedule__add:hover { background: var(--bf-orange); border-style: solid; }

/* ---------- BeFriends ---------- */
.bf-friends {
  background: var(--bf-orange-bg);
  border-block: 4px solid var(--bf-ink);
  padding: 96px 24px;
}
.bf-friends__inner {
  max-width: 1100px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 48px;
  align-items: center;
}
.bf-friends h2 {
  font-size: clamp(56px, 9vw, 140px);
  line-height: 0.85;
  letter-spacing: -0.04em;
  margin: 12px 0 24px;
}
.bf-friends h2 .be { display: block; }
.bf-friends h2 .friends {
  display: inline-block;
  background: var(--bf-ink);
  color: var(--bf-bone);
  padding: 0 0.12em;
  transform: rotate(-1.5deg);
}
.bf-friends p { font-size: 19px; line-height: 1.5; font-weight: 500; max-width: 480px; }
.bf-friends__card {
  background: var(--bf-paper);
  border: 4px solid var(--bf-ink);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 10px 10px 0 0 var(--bf-ink);
  transform: rotate(2deg);
}
.bf-friends__card .perks { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
.bf-friends__card .perks li {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 16px; font-weight: 600;
}
.bf-friends__card .perks li::before {
  content: ""; width: 18px; height: 18px; margin-top: 2px; flex: 0 0 18px;
  background: var(--bf-orange);
  border: 2px solid var(--bf-ink);
  border-radius: 999px;
}
.bf-friends__card .price-row {
  display: flex; justify-content: space-between; align-items: baseline;
  border-top: 2px dashed var(--bf-ink);
  padding-top: 18px;
  font-family: var(--bf-font-display);
}
.bf-friends__card .price-row .num { font-size: 56px; letter-spacing: -0.03em; line-height: 1; }

/* ---------- Sponsors ---------- */
.bf-sponsors { background: var(--bf-bone); }
.bf-sponsors__inner {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 64px;
  align-items: center;
}
.bf-sponsors h2 {
  font-size: clamp(48px, 7vw, 96px);
  line-height: 0.9;
  letter-spacing: -0.03em;
  margin: 12px 0 22px;
}
.bf-sponsors p { font-size: 17px; line-height: 1.55; font-weight: 500; max-width: 540px; }
.bf-sponsors__strip {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 24px;
}
.bf-sponsors__chip {
  border: 2px solid var(--bf-ink);
  background: var(--bf-paper);
  padding: 12px 18px;
  border-radius: 12px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 13px;
  letter-spacing: 0.04em;
  opacity: 0.75;
}
.bf-sponsors__cta {
  background: var(--bf-ink);
  color: var(--bf-bone);
  border-radius: 24px;
  padding: 36px;
  border: 4px solid var(--bf-ink);
  box-shadow: 10px 10px 0 0 var(--bf-orange);
}
.bf-sponsors__cta h3 {
  color: var(--bf-bone);
  font-size: 36px;
  line-height: 0.9;
  margin: 0 0 14px;
}
.bf-sponsors__cta p { color: rgba(247,239,226,0.75); font-size: 15px; margin: 0 0 20px; }

/* ---------- Footer additions ---------- */
.bf-footer__contact a { display: block; padding: 4px 0; font-size: 15px; }
.bf-footer__contact .label { font-family: var(--bf-font-display); font-size: 11px; letter-spacing: 0.12em; color: var(--bf-orange); display: block; }

/* ---------- Admin bar ---------- */
.bf-admin-bar {
  position: fixed;
  bottom: 20px; right: 20px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 10px;
  align-items: flex-end;
}
.bf-admin-toggle {
  background: var(--bf-ink);
  color: var(--bf-orange);
  border: 3px solid var(--bf-ink);
  padding: 10px 18px;
  border-radius: 999px;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.08em;
  cursor: pointer;
  display: inline-flex; gap: 8px; align-items: center;
  box-shadow: 4px 4px 0 0 var(--bf-orange);
}
.bf-admin-toggle.on { background: var(--bf-orange); color: var(--bf-ink); box-shadow: 4px 4px 0 0 var(--bf-ink); }
.bf-admin-toggle .led {
  width: 8px; height: 8px; border-radius: 999px;
  background: var(--bf-orange);
}
.bf-admin-toggle.on .led { background: var(--bf-ink); animation: bf-pulse 1.4s infinite; }

.bf-admin-banner {
  background: var(--bf-orange);
  color: var(--bf-ink);
  border-block: 3px dashed var(--bf-ink);
  padding: 10px 24px;
  text-align: center;
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.1em;
  position: sticky;
  top: 0; z-index: 60;
}

/* admin edit indicators */
.bf-editable { position: relative; }
.bf-admin .bf-editable { outline: 2px dashed transparent; outline-offset: 4px; transition: outline-color 0.2s; }
.bf-admin .bf-editable:hover { outline-color: var(--bf-orange); }

/* ---------- Modal ---------- */
.bf-modal__card--lg { max-width: 560px; }
.bf-modal__title {
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 28px;
  letter-spacing: -0.02em;
  margin: 0 0 18px;
}
.bf-formrow { display: grid; gap: 6px; margin-bottom: 14px; }
.bf-formrow label {
  font-family: var(--bf-font-display);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.1em;
}
.bf-formrow__inline { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bf-modal__actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 22px; align-items: center; }

/* ---------- Lightbox ---------- */
.bf-lightbox {
  position: fixed; inset: 0;
  background: rgba(10,10,10,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 300;
  padding: 32px;
  cursor: zoom-out;
}
.bf-lightbox img {
  max-width: min(100%, 1100px);
  max-height: 100%;
  border: 4px solid var(--bf-bone);
  border-radius: 12px;
  box-shadow: 12px 12px 0 0 var(--bf-orange);
}

/* ---------- Photo placeholder generated ---------- */
.bf-photo--placeholder { display: flex; align-items: center; justify-content: center; padding: 18px; }
.bf-photo--placeholder svg { width: 100%; height: 100%; }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .bf-info-grid { grid-template-columns: repeat(2, 1fr); }
  .bf-friends__inner { grid-template-columns: 1fr; }
  .bf-sponsors__inner { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .bf-about { grid-template-columns: 1fr; gap: 32px; }
  .bf-info-grid { grid-template-columns: 1fr; }
  .bf-section { padding: 64px 20px; }
  .bf-hero { padding: 100px 20px 64px; }
  .bf-schedule__head, .bf-gig { grid-template-columns: 110px 1fr 32px; }
  .bf-gig__stage { display: none; }
  .bf-schedule__head span:nth-child(3) { display: none; }
  .bf-gig__time { font-size: 18px; flex-direction: column; gap: 0; }
  .bf-gig__time-end { font-size: 13px; }
  .bf-gig__name { font-size: 20px; }
  .bf-gallery { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 140px; }
  .bf-photo--big { grid-column: span 6; }
  .bf-photo--wide { grid-column: span 6; }
  .bf-photo--tall { grid-column: span 3; }
  .bf-photo--sm { grid-column: span 3; }
  .bf-photo--sq { grid-column: span 3; }
  .bf-photo--rect { grid-column: span 3; }
  .bf-vibe__head { flex-direction: column; align-items: flex-start; }
}

  </style>

  <script type="text/babel">
/* Shared inline SVG components — the heart-clover BeFree sticker
   and small UI icons, drawn from scratch to match the brand mark. */

// Brand logo — uses the official PNG so proportions stay intact.
function HeartClover({ size = 48, rotate = 0, style = {} }) {
  return (
    <img
      src={window.LOGO_SRC}
      alt="BeFree"
      width={size}
      height={size}
      style={{
        display: 'inline-block',
        width: size,
        height: size,
        objectFit: 'contain',
        transform: rotate ? `rotate(${rotate}deg)` : undefined,
        ...style,
      }}
    />
  );
}

// Small wordmark-style "BEFREE" stamp used as standalone mark
function BefreeStamp({ rotate = -2, scale = 1 }) {
  return (
    <span
      className="bf-befree-stamp"
      style={{
        display: 'inline-flex',
        alignItems: 'center',
        gap: 8,
        fontFamily: 'var(--bf-font-display)',
        textTransform: 'uppercase',
        fontSize: 24 * scale,
        letterSpacing: '-0.02em',
        transform: `rotate(${rotate}deg)`
      }}
    >
      <HeartClover size={36 * scale} />
      <span>BEFREE</span>
    </span>
  );
}

function Icon({ name, size = 18 }) {
  const stroke = 'currentColor';
  const props = {
    width: size, height: size, viewBox: '0 0 24 24',
    fill: 'none', stroke, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round'
  };
  switch (name) {
    case 'arrow':       return <svg {...props}><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
    case 'edit':        return <svg {...props}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>;
    case 'plus':        return <svg {...props}><path d="M12 5v14M5 12h14"/></svg>;
    case 'close':       return <svg {...props}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    case 'trash':       return <svg {...props}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>;
    case 'upload':      return <svg {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>;
    case 'instagram':   return <svg {...props}><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>;

  <script type="text/babel">
// Data store — default content + localStorage persistence

const STORAGE_KEY = 'befree_site_v2';

const DEFAULT_LINEUP = [
  { id: 'g1', time: '15:00', end: '15:45', name: 'Old Fashion',     note: '', stage: 'main' },
  { id: 'g2', time: '16:15', end: '17:00', name: 'Frontstage',      note: '', stage: 'main' },

  { id: 'g8', time: '22:00', end: '23:00', name: 'The Gonutz',      note: '', stage: 'main' },
  { id: 'g9', time: '23:15', end: '00:00', name: 'Mr. Wienen',      note: '', stage: 'main' },
];

const DEFAULT_PHOTOS = [
  // Auto-filled with generated SVG placeholders, see App init
];

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Storage failed', e);
  }
}

// Generate placeholder photos (varied warm-toned SVG) so the gallery isn't empty
function makePlaceholderPhotos() {
  const moods = [
    { hue: '#e1582c', accent: '#f14702', tag: 'Editie 2024', size: 'big',  caption: 'Tuinpodium' },
    { hue: '#0a0a0a', accent: '#f14702', tag: 'Editie 2024', size: 'tall', caption: 'Nacht' },
    { hue: '#c43904', accent: '#ffe5d6', tag: 'Editie 2024', size: 'sm',   caption: 'Buren' },
    { hue: '#f14702', accent: '#0a0a0a', tag: 'Editie 2023', size: 'wide', caption: 'Crowd' },
    { hue: '#1a1a1a', accent: '#e1582c', tag: 'Editie 2023', size: 'rect', caption: 'Crew' },
    { hue: '#e1582c', accent: '#f7efe2', tag: 'Editie 2023', size: 'sq',   caption: 'Hoofdpodium' },
    { hue: '#0a0a0a', accent: '#f14702', tag: 'Editie 2022', size: 'sm',   caption: 'Backstage' },
  ];
  return moods.map((m, i) => ({
    id: 'pl' + i,
    src: '__placeholder__',
    mood: m,
    year: m.tag,
    size: m.size,
  }));
}

const initialState = loadState() || {
  lineup: DEFAULT_LINEUP,
  photos: makePlaceholderPhotos(),
  meta: {
    title: 'BeFree',
    year: 2026,
    date: '5 september 2026',
    location: 'St. Michaëlstraat 8, Steyl',
    venueNote: 'Achter het Wereldpaviljoen',
  },
};

// Simple subscribable store
const store = (() => {
  let state = initialState;
  const listeners = new Set();
  return {
    get: () => state,
    set: (updater) => {
      state = typeof updater === 'function' ? updater(state) : { ...state, ...updater };
      saveState(state);
      listeners.forEach(fn => fn(state));
    },
    subscribe: (fn) => {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },
    reset: () => {
      localStorage.removeItem(STORAGE_KEY);
      state = {
        lineup: DEFAULT_LINEUP,
        photos: makePlaceholderPhotos(),
        meta: state.meta,
      };
      listeners.forEach(fn => fn(state));
    },
  };
})();

function useStore() {
  const [s, setS] = React.useState(store.get());
  React.useEffect(() => store.subscribe(setS), []);
  return s;
}

window.store = store;
window.useStore = useStore;

        </div>

        <div className="bf-formrow">
          <label>Artiest / naam</label>
          <input className="bf-field" type="text" value={form.name} onChange={e => update('name', e.target.value)} placeholder="Naam van de act" />
        </div>

        <div className="bf-formrow">
          <label>Korte beschrijving (optioneel)</label>
          <input className="bf-field" type="text" value={form.note || ''} onChange={e => update('note', e.target.value)} placeholder="Indie folk uit Tegelen" />

              onClick={() => onSave({
                ...form,
                id: form.id || 'g_' + Date.now().toString(36),
                name: form.name.trim(),
                note: (form.note || '').trim(),
                end: (form.end || '').trim(),
              })}

            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// Photo upload modal — file picker + year tag
function PhotoUploadModal({ open, onClose, onSave }) {
  const [files, setFiles] = React.useState([]); // [{src, year}]
  const [year, setYear] = React.useState('Editie 2025');
  const inputRef = React.useRef(null);

  React.useEffect(() => { if (open) setFiles([]); }, [open]);

  if (!open) return null;

  const handleFiles = async (fileList) => {
    const arr = Array.from(fileList).slice(0, 12);
    const processed = await Promise.all(arr.map(f => readAndCompress(f)));
    setFiles(prev => [...prev, ...processed.filter(Boolean).map(src => ({ src, year }))]);
  };

  const onDrop = (e) => {
    e.preventDefault();
    handleFiles(e.dataTransfer.files);
  };

  return (
    <div className="bf-modal" onClick={onClose}>
      <div
        className="bf-modal__card bf-modal__card--lg"
        onClick={e => e.stopPropagation()}
        onDragOver={e => e.preventDefault()}
        onDrop={onDrop}
      >
        <button className="bf-modal__close" onClick={onClose}><Icon name="close" size={14} /></button>
        <h3 className="bf-modal__title">Foto's uploaden</h3>

        <div className="bf-formrow">
          <label>Editie / jaar</label>
          <input className="bf-field" value={year} onChange={e => setYear(e.target.value)} />
        </div>

        <input
          ref={inputRef}
          type="file"
          multiple
          accept="image/*"
          style={{ display: 'none' }}
          onChange={e => handleFiles(e.target.files)}
        />

        <div
          onClick={() => inputRef.current?.click()}
          style={{
            border: '3px dashed var(--bf-ink)',
            borderRadius: 16,
            padding: 32,
            textAlign: 'center',
            cursor: 'pointer',
            background: 'var(--bf-orange-tint)',
            fontFamily: 'var(--bf-font-display)',
            textTransform: 'uppercase',
            fontSize: 14,
            letterSpacing: '0.04em',
          }}
        >
          <Icon name="upload" size={32} /><br/>
          Kies foto's of sleep ze hierheen<br/>
          <small style={{ fontFamily: 'var(--bf-font-body)', fontSize: 12, letterSpacing: 0, textTransform: 'none', color: 'var(--bf-mute)' }}>
            JPG/PNG, automatisch verkleind voor de browser
          </small>
        </div>

        {files.length > 0 && (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginTop: 18 }}>
            {files.map((f, i) => (
              <div key={i} style={{ border: '2px solid var(--bf-ink)', borderRadius: 10, overflow: 'hidden', aspectRatio: '1', background: 'var(--bf-bone)' }}>
                <img src={f.src} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
              </div>
            ))}
          </div>
        )}

        <div className="bf-modal__actions">
          <span style={{ fontSize: 13, color: 'var(--bf-mute)' }}>
            {files.length} foto{files.length !== 1 ? "'s" : ''} klaar
          </span>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="bf-btn bf-btn--ghost" onClick={onClose}>Annuleren</button>
            <button
              className="bf-btn bf-btn--primary"
              disabled={files.length === 0}
              onClick={() => { onSave(files.map(f => ({ ...f, year }))); onClose(); }}
            >
              Toevoegen <Icon name="check" size={14} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// Resize images to max 1400px wide and JPEG-encode at 0.82 for localStorage friendliness
async function readAndCompress(file) {
  if (!file.type.startsWith('image/')) return null;
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const max = 1400;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

window.AdminBanner = AdminBanner;
window.GigModal = GigModal;
window.PhotoUploadModal = PhotoUploadModal;

  <script type="text/babel">
// Root app

function App() {
  const [active, setActive] = React.useState('top');
  const [admin, setAdmin] = React.useState(false);
  const [editGig, setEditGig] = React.useState(null);
  const [showGigModal, setShowGigModal] = React.useState(false);
  const [showUpload, setShowUpload] = React.useState(false);

  const onNav = (id) => {
    setActive(id);
    const el = document.getElementById(id);
    if (el) {
      const y = el.getBoundingClientRect().top + window.pageYOffset - 80;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  };

  // Scroll-spy for nav highlight
  React.useEffect(() => {
    const ids = ['top', 'over', 'sfeer', 'info', 'lineup', 'befriends', 'sponsors'];
    const onScroll = () => {
      const y = window.scrollY + 120;
      for (let i = ids.length - 1; i >= 0; i--) {
        const el = document.getElementById(ids[i]);
        if (el && el.offsetTop <= y) { setActive(ids[i]); return; }
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // Gig editing
  const saveGig = (gig) => {
    window.store.set(s => {
      const exists = s.lineup.some(x => x.id === gig.id);
      return {
        ...s,
        lineup: exists ? s.lineup.map(x => x.id === gig.id ? gig : x) : [...s.lineup, gig],
      };
    });
    setShowGigModal(false);
    setEditGig(null);
  };
  const deleteGig = (id) => {
    if (!confirm('Deze act verwijderen?')) return;
    window.store.set(s => ({ ...s, lineup: s.lineup.filter(x => x.id !== id) }));
    setShowGigModal(false);
    setEditGig(null);
  };

  // Photos
  const addPhotos = (newOnes) => {
    window.store.set(s => ({
      ...s,
      photos: [
        ...newOnes.map((p, i) => ({ id: 'p_' + Date.now().toString(36) + '_' + i, src: p.src, year: p.year })),
        ...s.photos,
      ],
    }));
  };
  const deletePhoto = (id) => {
    window.store.set(s => ({ ...s, photos: s.photos.filter(p => p.id !== id) }));
  };

  return (
    <>
      {admin && <AdminBanner onReset={() => { if (confirm('Alle wijzigingen verwijderen?')) window.store.reset(); }} />}
      <div className={admin ? 'bf-admin' : ''}>
        <NavBar active={active} onNav={onNav} />

        <Hero onLineup={() => onNav('lineup')} onScrollNext={onNav} />

        <Marquee
          items={['BeFree 2026', '5 september · Steyl', 'Gratis toegang', 'Line-up dropt binnenkort', 'Word BeFriend']}
          tilt={-1.5}
        />

        <About />

        <Vibe
          admin={admin}
          onUpload={() => setShowUpload(true)}
          onDelete={deletePhoto}
        />

        <Marquee
          items={['Achter het Wereldpaviljoen', '14:00 — 00:00', 'Eén dag, twee podia', 'Een hoop bier']}
          tilt={1.2}
          dark
        />

        <InfoSection />

        <LineUp
          admin={admin}
          onEdit={(g) => { setEditGig(g); setShowGigModal(true); }}
          onAdd={() => { setEditGig(null); setShowGigModal(true); }}
        />

        <BeFriends onScrollNext={onNav} />

        <Sponsors />

        <Footer />
      </div>

      <AdminBar admin={admin} setAdmin={setAdmin} />

      <GigModal
        open={showGigModal}
        gig={editGig}
        onClose={() => { setShowGigModal(false); setEditGig(null); }}
        onSave={saveGig}
        onDelete={deleteGig}
      />

      <PhotoUploadModal
        open={showUpload}
        onClose={() => setShowUpload(false)}
        onSave={addPhotos}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);

  </script>
